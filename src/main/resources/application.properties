spring.application.name=users
server.port=${SERVER_PORT:8080}

# Se importa la configuracion local si existe.
spring.config.import=optional:file:.env[.properties]

# Conexion a PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventpass_users}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Configuracion de desarrollo para crear o actualizar las tablas desde las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Firma y vigencia de los JWT.
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
